<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="gm.ico" type="image/x-icon">
<title>Conversation Spinner · easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0e12;
    --bg-soft: #15151c;
    --text: #f5f3ef;
    --muted: #8a8a96;
    --accent: #ffb86b;
    --accent-2: #ff7a59;
    --accent-3: #6be0c9;
    --line: rgba(255,255,255,0.08);
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    letter-spacing: -0.58px;
    overflow-x: hidden;
  }

  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 0%, rgba(255,184,107,0.10), transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% 100%, rgba(107,224,201,0.08), transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(255,122,89,0.05), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .stage{
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    gap: 44px;
  }

  header{
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .eyebrow{
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.9;
  }
  h1{
    font-size: clamp(26px, 4vw, 42px);
    font-weight: 700;
    letter-spacing: -1.4px;
    line-height: 1.1;
  }
  h1 span{
    background: linear-gradient(100deg, var(--accent), var(--accent-2) 60%, var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .main{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 5vw, 72px);
    flex-wrap: wrap;
    width: 100%;
    max-width: 1100px;
  }

  .spin-block{
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 40px);
    flex-wrap: nowrap;
  }

  .wheel-wrap{
    position: relative;
    width: clamp(280px, 34vw, 400px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .wheel-glow{
    position: absolute;
    inset: -18%;
    background: radial-gradient(circle, rgba(255,184,107,0.16), transparent 65%);
    filter: blur(10px);
    pointer-events: none;
  }

  svg.wheel{
    width: 100%;
    height: 100%;
    transform: rotate(0deg);
    transition: transform 4s cubic-bezier(0.16, 1, 0.3, 1);
    filter: drop-shadow(0 20px 60px rgba(0,0,0,0.6));
  }

  svg.wheel path.used{
    opacity: 0.28;
    transition: opacity 0.6s ease;
  }
  svg.wheel text.used{
    opacity: 0.18;
    transition: opacity 0.6s ease;
  }

  .pointer{
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 22px solid var(--accent);
    filter: drop-shadow(0 4px 10px rgba(255,184,107,0.5));
    z-index: 3;
  }

  .hub{
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #23232e, #0e0e12 70%);
    border: 1px solid rgba(255,255,255,0.12);
    display: grid;
    place-items: center;
    z-index: 2;
    box-shadow: 0 0 0 10px rgba(14,14,18,0.9), 0 10px 30px rgba(0,0,0,0.6);
  }
  .hub svg{ width: 40%; height: 40%; opacity: 0.9; }

  .spin-side{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-width: 220px;
    max-width: 300px;
    flex: 0 1 auto;
  }

  .spin-btn{
    position: relative;
    font-family: inherit;
    letter-spacing: -0.58px;
    font-size: 16px;
    font-weight: 600;
    color: #0e0e12;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 100px;
    padding: 18px 36px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s;
    box-shadow: 0 10px 30px rgba(255,140,90,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
    overflow: hidden;
    white-space: nowrap;
    z-index: 4;
  }
  .spin-btn:hover:not(:disabled){
    transform: translateY(-2px);
    box-shadow: 0 16px 40px rgba(255,140,90,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .spin-btn:active:not(:disabled){ transform: translateY(0); }
  .spin-btn:disabled{ opacity: 0.55; cursor: not-allowed; }

  .question{
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 10px;
    padding: 0 4px;
    width: 100%;
  }
  .question .label{
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    transition: opacity 0.3s;
  }
  .question .text{
    font-size: clamp(17px, 1.9vw, 22px);
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.8px;
    background: linear-gradient(180deg, #ffffff, #cfcfd8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: opacity 0.4s, transform 0.4s;
    min-height: 3.9em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question .text.fade{
    opacity: 0;
    transform: translateY(8px);
  }

  /* ============ SIDEBAR — rail fininho no desktop ============ */
  .panel{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    flex: 0 0 auto;
    background: transparent;
    border: none;
    padding: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  /* Esconde no mobile até o sorteio (via JS troca data-visible) */
  .panel[data-visible="false"]{
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
  }

  /* Mobile: também não ocupa espaço enquanto escondida */
  @media (max-width: 900px){
    .panel[data-visible="false"]{
      display: none;
    }
  }

  .panel-title{
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
    white-space: nowrap;
  }

  .timer-zone{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .timer-ring{
    position: relative;
    width: 130px;
    height: 130px;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 0 22px rgba(255,184,107,0.10));
  }
  .timer-ring svg{
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .timer-ring .track{
    fill: none;
    stroke: rgba(255,255,255,0.07);
    stroke-width: 6;
  }
  .timer-ring .progress{
    fill: none;
    stroke: url(#gradTimer);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 408.4;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }
  .timer-time{
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -1.2px;
    font-variant-numeric: tabular-nums;
  }
  .timer-time.warn{ color: var(--accent-2); }

  .timer-actions{
    display: flex;
    gap: 8px;
  }
  .ghost-btn{
    font-family: inherit;
    letter-spacing: -0.58px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .ghost-btn:hover{
    border-color: rgba(255,184,107,0.5);
    color: var(--accent);
  }
  .ghost-btn.primary{
    background: rgba(255,184,107,0.12);
    border-color: rgba(255,184,107,0.35);
    color: var(--accent);
  }

  .hint{
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.2px;
    text-align: center;
    max-width: 160px;
    line-height: 1.5;
    opacity: 0.8;
  }

  /* ============ RODAPÉ ============ */
  .footer{
    position: relative;
    z-index: 1;
    padding: 0 24px 28px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.2px;
  }
  .footer a{
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.25s ease, opacity 0.25s ease;
  }
  .footer a:hover{
    color: var(--accent-2);
    opacity: 0.9;
  }

  @media (min-width: 901px){
    .spin-block{
      flex-direction: row;
      align-items: center;
    }
  }

  @media (max-width: 900px){
    .spin-block{
      flex-direction: column;
      gap: 24px;
    }
    .spin-side{
      align-items: center;
      min-width: 0;
      max-width: 360px;
      width: 100%;
    }
    .spin-btn{
      padding: 16px 40px;
      font-size: 15px;
    }
    .panel{
      width: 100%;
    }
  }

  @media (max-width: 720px){
    .main{ gap: 32px; }
    .stage{ padding: 36px 18px; gap: 32px; }
    .wheel-wrap{ width: clamp(260px, 78vw, 360px); }
  }
</style>
</head>
<body>

<div class="stage">

  <header>
    <div class="eyebrow">English Speaking · Easy</div>
    <h1>Spin the <span>Conversation</span></h1>
  </header>

  <div class="main">

    <div class="spin-block">

      <div class="wheel-wrap">
        <div class="wheel-glow"></div>
        <div class="pointer"></div>
        <svg class="wheel" id="wheel" viewBox="0 0 400 400" aria-hidden="true">
          <defs>
            <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
              <stop offset="70%" stop-color="rgba(255,255,255,0.02)"/>
              <stop offset="100%" stop-color="rgba(255,255,255,0.10)"/>
            </radialGradient>
            <linearGradient id="gradTimer" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffb86b"/>
              <stop offset="100%" stop-color="#ff7a59"/>
            </linearGradient>
          </defs>
          <circle cx="200" cy="200" r="196" fill="url(#rimGrad)"/>
          <g id="wheelSlices"></g>
          <circle cx="200" cy="200" r="188" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
        </svg>
        <div class="hub">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffb86b" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
          </svg>
        </div>
      </div>

      <div class="spin-side">
        <button class="spin-btn" id="spinBtn">Girar a roleta</button>

        <div class="question" id="question">
          <div class="label" id="qLabel">Ready when you are</div>
          <div class="text" id="qText">Pressione girar para sortear uma pergunta</div>
        </div>
      </div>

    </div>

    <!-- Sidebar "rail" fininho -->
    <aside class="panel" id="panel" data-visible="false">

      <div class="panel-title">Timer</div>

      <div class="timer-zone">
        <div class="timer-ring">
          <svg viewBox="0 0 150 150">
            <circle class="track" cx="75" cy="75" r="65"/>
            <circle class="progress" id="timerProgress" cx="75" cy="75" r="65"/>
          </svg>
          <div class="timer-time" id="timerTime">1:00</div>
        </div>
        <div class="timer-actions">
          <button class="ghost-btn primary" id="startTimer">Iniciar</button>
          <button class="ghost-btn" id="resetTimer">Reiniciar</button>
        </div>
      </div>

      <div class="hint">Fale em inglês por 1 minuto sobre o tópico sorteado</div>

    </aside>
  </div>
</div>

<footer class="footer">
  desenvolvido por <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer">@dicarvalho.prof</a>
</footer>

<script>
/* =========================================================
   🔊 ÁUDIOS — links do Cloudinary
   ========================================================= */
const AUDIO_URLS = {
  spin:  "https://res.cloudinary.com/dbwqwgbtx/video/upload/v1793829943/leom2024-roleta-267662_wapjdu.mp3",
  click: "https://res.cloudinary.com/dbwqwgbtx/video/upload/v1793830082/liecio-achive-sound-132273_hs2pcu.mp3"
};
/* ========================================================= */

/* ====== PERGUNTAS A1–A2 ====== */
const QUESTIONS = [
  "What is your favorite food? Why do you like it?",
  "Describe your perfect weekend.",
  "Talk about a place you want to visit.",
  "What do you usually do in the morning?",
  "Tell me about your best friend.",
  "What is your favorite movie or series?",
  "Describe your family.",
  "What did you do last weekend?",
  "Do you prefer cats or dogs? Why?",
  "Talk about your favorite hobby.",
  "What is your dream job?",
  "Describe your bedroom.",
  "What do you do when you feel stressed?",
  "Talk about a happy memory from your childhood.",
  "What is your favorite season of the year?",
  "Do you like cooking? What can you cook?",
  "Describe a typical day in your life.",
  "What music do you listen to?",
  "Talk about a person you admire.",
  "What is the best gift you have ever received?",
  "Do you like sports? Which ones?",
  "Describe your city or town.",
  "What are you afraid of?",
  "Talk about your last vacation.",
  "What do you want to learn this year?",
  "Describe your favorite clothes.",
  "What do you do on rainy days?",
  "Talk about a book you like.",
  "Do you prefer the beach or the mountains?",
  "What is your favorite day of the week? Why?"
];

/* ====== SISTEMA DE ÁUDIO ====== */
const hasRealUrl = (u) => u && !u.startsWith("COLE_AQUI");

const audioSpin = new Audio();
audioSpin.src = hasRealUrl(AUDIO_URLS.spin) ? AUDIO_URLS.spin : "";
audioSpin.preload = "auto";
audioSpin.volume = 0.35;

const audioClick = new Audio();
audioClick.src = hasRealUrl(AUDIO_URLS.click) ? AUDIO_URLS.click : "";
audioClick.preload = "auto";
audioClick.volume = 0.5;

const SPIN_DURATION = 4;

function playBeep(rate = 1, volume = 0.5){
  if (!hasRealUrl(AUDIO_URLS.click)) return;
  try{
    const clone = audioClick.cloneNode();
    clone.volume = volume;
    clone.playbackRate = rate;
    clone.play().catch(() => {});
  } catch(e){ /* silencioso */ }
}

function playSpinSound(){
  if (!hasRealUrl(AUDIO_URLS.spin)) return;
  try{
    audioSpin.currentTime = 0;
    audioSpin.playbackRate = 0.96 + Math.random() * 0.08;
    audioSpin.volume = 0.35;
    audioSpin.play().catch(() => {});
  } catch(e){ /* silencioso */ }
}

function stopSpinSound(){
  if (!hasRealUrl(AUDIO_URLS.spin)) return;
  try{
    const startVol = audioSpin.volume;
    if (startVol <= 0.01){
      audioSpin.pause();
      audioSpin.currentTime = 0;
      audioSpin.volume = 0.35;
      return;
    }
    const steps = 8;
    let i = 0;
    const fade = setInterval(() => {
      i++;
      const v = Math.max(0, startVol * (1 - i / steps));
      audioSpin.volume = v;
      if (i >= steps){
        clearInterval(fade);
        audioSpin.pause();
        audioSpin.currentTime = 0;
        audioSpin.volume = 0.35;
      }
    }, 50);
  } catch(e){ /* silencioso */ }
}

/* ====== CONSTRUÇÃO DA ROLETA ====== */
const SLICE_COLORS = [
  "#1c1c26", "#23232f", "#2a2a38", "#1a1a23",
  "#252532", "#1f1f2a", "#2c2c3b", "#181820"
];

const wheelSlices = document.getElementById("wheelSlices");
const wheel = document.getElementById("wheel");
const spinBtn = document.getElementById("spinBtn");
const qText = document.getElementById("qText");
const qLabel = document.getElementById("qLabel");
const panel = document.getElementById("panel");
const timerTime = document.getElementById("timerTime");
const timerProgress = document.getElementById("timerProgress");
const startTimerBtn = document.getElementById("startTimer");
const resetTimerBtn = document.getElementById("resetTimer");

const SLICES = QUESTIONS.length;
const cx = 200, cy = 200, r = 188;
const sliceEls = [];

function polar(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function slicePath(startAngle, endAngle, rOuter){
  const p1 = polar(cx, cy, rOuter, startAngle);
  const p2 = polar(cx, cy, rOuter, endAngle);
  const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z`;
}

function buildWheel(){
  const sliceAngle = 360 / SLICES;
  for (let i = 0; i < SLICES; i++){
    const start = i * sliceAngle;
    const end = start + sliceAngle;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", slicePath(start, end, r));
    path.setAttribute("fill", SLICE_COLORS[i % SLICE_COLORS.length]);
    path.setAttribute("stroke", "rgba(255,255,255,0.06)");
    path.setAttribute("stroke-width", "1");
    wheelSlices.appendChild(path);

    const mid = start + sliceAngle / 2;
    const np = polar(cx, cy, r * 0.82, mid);
    const num = document.createElementNS("http://www.w3.org/2000/svg", "text");
    num.setAttribute("x", np.x);
    num.setAttribute("y", np.y);
    num.setAttribute("text-anchor", "middle");
    num.setAttribute("dominant-baseline", "middle");
    num.setAttribute("fill", "rgba(255,255,255,0.28)");
    num.setAttribute("font-size", "13");
    num.setAttribute("font-family", "Poppins, sans-serif");
    num.setAttribute("font-weight", "500");
    num.textContent = i + 1;
    wheelSlices.appendChild(num);

    sliceEls.push({ path, text: num });
  }
}
buildWheel();

/* ====== LÓGICA DO SORTEIO ====== */
let currentRotation = 0;
let isSpinning = false;
let deck = [];
let lastPickedIndex = -1;

function refillDeck(){
  deck = QUESTIONS.map((_, i) => i);
  for (let i = deck.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  if (deck[0] === lastPickedIndex && deck.length > 1){
    [deck[0], deck[1]] = [deck[1], deck[0]];
  }
}

function resetWheelVisual(){
  sliceEls.forEach(({ path, text }) => {
    path.classList.remove("used");
    text.classList.remove("used");
  });
}

function markSliceUsed(index){
  const el = sliceEls[index];
  if (el){
    el.path.classList.add("used");
    el.text.classList.add("used");
  }
}

refillDeck();

function spin(){
  if (isSpinning) return;
  isSpinning = true;
  spinBtn.disabled = true;

  playBeep(1, 0.5);
  playSpinSound();

  qText.classList.add("fade");
  qLabel.textContent = "Spinning...";

  if (deck.length === 0){
    resetWheelVisual();
    refillDeck();
  }

  const index = deck.pop();
  lastPickedIndex = index;

  const sliceAngle = 360 / SLICES;
  const turns = 5 + Math.floor(Math.random() * 3);
  const sliceCenter = index * sliceAngle + sliceAngle / 2;
  const jitter = (Math.random() - 0.5) * (sliceAngle * 0.6);
  const targetRotation = currentRotation + turns * 360 - sliceCenter + jitter - (currentRotation % 360);

  wheel.style.transitionDuration = SPIN_DURATION + "s";
  void wheel.offsetWidth;
  wheel.style.transform = `rotate(${targetRotation}deg)`;
  currentRotation = targetRotation;

  setTimeout(() => {
    isSpinning = false;
    spinBtn.disabled = false;

    stopSpinSound();
    playBeep(1.25, 0.4);

    qText.textContent = QUESTIONS[index];
    qText.classList.remove("fade");

    markSliceUsed(index);

    const remaining = deck.length;
    qLabel.textContent = remaining > 0
      ? `Your topic · ${remaining} left in this round`
      : "Last one in this round · talk for 1 minute";

    // Revela a sidebar (no mobile aparece; no desktop já estava visível)
    panel.setAttribute("data-visible", "true");
    resetTimer();
  }, SPIN_DURATION * 1000);
}

spinBtn.addEventListener("click", spin);

/* ====== TIMER ====== */
const TOTAL = 60;
let timeLeft = TOTAL;
let timerInterval = null;
let timerRunning = false;
const CIRCUMFERENCE = 2 * Math.PI * 65;

timerProgress.style.strokeDasharray = CIRCUMFERENCE;

function updateTimerDisplay(){
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  timerTime.textContent = `${m}:${s.toString().padStart(2,"0")}`;
  const offset = CIRCUMFERENCE * (1 - timeLeft / TOTAL);
  timerProgress.style.strokeDashoffset = offset;

  if (timeLeft <= 10) timerTime.classList.add("warn");
  else timerTime.classList.remove("warn");
}

function startTimer(){
  if (timerRunning || timeLeft <= 0) return;
  timerRunning = true;
  startTimerBtn.textContent = "Pausar";
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      timerRunning = false;
      startTimerBtn.textContent = "Iniciar";
      timerTime.textContent = "0:00";
      timerTime.classList.add("warn");

      playBeep(0.8, 0.55);
      setTimeout(() => playBeep(0.8, 0.55), 220);
      setTimeout(() => playBeep(0.8, 0.55), 440);
    }
  }, 1000);
}

function pauseTimer(){
  if (!timerRunning) return;
  clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
  startTimerBtn.textContent = "Retomar";
}

function resetTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
  timeLeft = TOTAL;
  startTimerBtn.textContent = "Iniciar";
  updateTimerDisplay();
  timerTime.classList.remove("warn");
}

startTimerBtn.addEventListener("click", () => {
  playBeep(1, 0.45);
  if (timerRunning) pauseTimer();
  else startTimer();
});

resetTimerBtn.addEventListener("click", () => {
  playBeep(0.9, 0.45);
  resetTimer();
});

/* ====== INICIALIZAÇÃO ====== */
updateTimerDisplay();

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && document.activeElement !== startTimerBtn && document.activeElement !== resetTimerBtn){
    e.preventDefault();
    if (!isSpinning) spin();
  }
});
</script>
</body>
</html>
